[package]
name = "ely-kit-compat"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Ely and a Fast-compatible GPUI Kit in one app and one window."

[lib]
path = "src/lib.rs"

[dev-dependencies]
ely-gpui-component = { path = "../..", features = ["test-support"] }
gpui-kit = { version = "=0.9.1", features = ["gpui-fast", "test-support"] }

[workspace]

# Match Ely's runtime source; these are Fast packages, not pre compatibility shims.
[patch.crates-io]
gpui-fast = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-platform = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-web = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-macros = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-linux = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-macos = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-windows = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-wgpu = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
gpui-fast-apple = { git = "https://github.com/kangxiaoju/Ely-GPUI-Components.git", rev = "40427c396cc92b6946940e0e498612a8b680ce30" }
